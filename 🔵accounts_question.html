<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>💳 계좌 목록</title>
</head>

<body>
  <div class="section">
  <h2>💳 한세은행 계좌 조회</h2>
  <button onclick="loadAccounts()">DB 계좌 불러오기</button>
  <ul id="list"></ul>
  </div>

  <div class="section">
  <h3>✏️ 수정 및 삭제</h3>
  <div class="row">
  <input id="id" type="number" placeholder="ID 입력" />
  <input id="balance" type="number" placeholder="새 잔액 입력" />
  </div>
  <button onclick="updateAccount()">수정</button>
  <button onclick="deleteAccount()">삭제</button>
  </div>    

  <div class="section">
  <h3>🧁 계좌 추가하기</h3>
  <div class="row">
  <input id="owner" placeholder="이름">
  <input id="balance2" placeholder="초기 잔액" type="number">
  </div>
  <button onclick="addAccount()"> 계좌 추가</button>
  </div>

  <script>
    async function loadAccounts() {
      const res = await fetch("_______________________________"); // [1] 전체 계좌 목록을 조회하는 API 주소 (GET)
      const data = await res.json(); // [2] 서버에서 받은 JSON 데이터를 자바스크립트 객체로 변환
      console.log("📦 서버에서 받은 DB 데이터:", data);

      const list = document.getElementById("list");
      list.innerHTML = "";
      data.forEach(acc => {
        const li = document.createElement("li");
        li.textContent = `id: ${acc.id}   예금주: ${acc.owner}님 // 잔액: ${acc.balance}원`;
        list.appendChild(li);
      });
    }

    async function updateAccount() {
      const id = document.getElementById("id").value;
      const balance = document.getElementById("balance").value;

      if (id === "" || balance === "") {
        return alert("ID와 잔액을 입력하세요!");
      }
      console.log("🚀 fetch 실행됨");
      
      const res = await fetch("_______________________________", { // [3] 계좌 잔액을 수정하는 API 주소 (POST)
        method: "__________", // [4] 수정 요청에 사용하는 HTTP 메서드
        headers: {
          "Content-Type": "application/x-www-form-urlencoded" // body에 데이터를 담아 보내기 위한 Content-Type
        },
        body: "_______________________________"  // [5] 서버로 전달할 데이터 (id와 balance를 key=value 형태로 작성)
      });

      const text = await res.text();
      console.log("📢 서버 응답:", text);
      alert(text);
      loadAccounts();
    }

    async function deleteAccount() {
      const id = document.getElementById("id").value;
      if (!id) return alert("ID를 입력하세요!");
      const res = await fetch(`_______________________________`,         // [6] 특정 계좌를 삭제하는 API 주소 (id 포함)
        { method: "__________" } // [7] 삭제 요청에 사용하는 HTTP 메서드
      );
      alert(await res.text());
      loadAccounts();
    }
    
     // 계좌 추가 기능
    async function addAccount() {
      const owner = document.getElementById("owner").value.trim();
      const balance2 = document.getElementById("balance2").value.trim();
      if (owner === "" || balance2 === "") {
        return alert("이름과 잔액을 입력하세요!");
      }
      const res = await fetch("_______________________________", { // [8] 계좌를 새로 추가하는 API 주소
        method: "__________", // [9] 계좌 추가 요청에 사용하는 HTTP 메서드
        headers: {
          "Content-Type": "application/x-www-form-urlencoded" //body 데이터를 서버가 읽을 수 있도록 지정
        }, // [9] 아래 헤드와 바디에 내용 담아 서버로 전달
        ____ : `owner=${encodeURIComponent(owner)}&balance2=${balance2}` // owner와 balance2를 body에 담아 서버로 전송
      });

      const text = await res.text();
      alert(text);
      loadAccounts();
    }
  </script>
</body>
</html>
