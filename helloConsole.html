<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한세고 서버 연동 실습</title>
</head>
<body>
  <h2>🎯 이벤트 실습</h2>
  <button onclick="sayHello()">클릭!</button>

  <script>
    // ✅ sayHello() 함수: 버튼 클릭 시 실행
    function sayHello() {
      console.log("✅ 버튼이 클릭되었습니다!");
      alert("안녕! 콘솔을 확인해보세요 👀");
    }
  </script>


<!-- 두번째 -->
<h2>📡 서버 연동 예제</h2>
  <button onclick="getMessage()">서버에 요청 보내기</button>
  <div id="result" style="margin-top:10px; background:#e3f2fd; padding:10px;"></div>

  <script>
    async function getMessage() {
      console.log("📨 서버에 요청을 보냅니다...");

      // ✅ fetch(): JS가 서버에 요청을 보내는 함수
      const response = await fetch("http://localhost:8090/api/hello");

      // ✅ 서버가 보낸 텍스트를 읽기
      const text = await response.text();

      // ✅ 화면에 출력
      document.getElementById("result").innerText = "서버 응답: " + text;
      console.log("🎯 서버 응답:", text);
    }
  </script>
</body>
</html>
